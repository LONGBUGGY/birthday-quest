<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Birthday Quest · Written in the Stars</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Be+Vietnam+Pro:wght@400;600&display=swap">
<style>
/* ================= STYLE ================= */
:root{--navy:#0a1030;--purple:#2a1250;--gold:#e6cd97;--gold2:#b98f4a;--ink:#f6efe0;--mute:#b9b0cf;--glass:rgba(255,255,255,.07);--line:rgba(230,205,151,.35);
--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--navy)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--ink);font-family:var(--sans);overflow-x:hidden;
background:radial-gradient(ellipse at 18% 8%,var(--purple) 0,transparent 60%),radial-gradient(ellipse at 88% 92%,#1a1f5c 0,transparent 55%),var(--navy)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(var(--navy),rgba(10,16,48,0))}
#prog{flex:1;display:flex;gap:5px}#prog i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
#prog i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--gold2),var(--gold));transform:scaleX(0);transform-origin:left;transition:transform .8s}
#prog i.on::after{transform:scaleX(1)}#prog i.cur::after{transform:scaleX(.35)}
#lab{font-size:12.5px;color:var(--mute);min-width:3.6em;text-align:right}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--gold);font-size:16px;cursor:pointer;padding:0;margin:0}
main{position:relative;z-index:2;max-width:520px;margin:0 auto;padding:0 20px calc(12px + env(safe-area-inset-bottom,0px))}
.stage{display:none;min-height:calc(100vh - 72px);min-height:calc(100dvh - 72px);flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px 0 14px}
.stage.show{display:flex;animation:in .9s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1,h2{font-family:var(--serif);font-weight:600;margin:0;line-height:1.05}
h1{font-size:clamp(44px,13vw,68px);font-style:italic;background:linear-gradient(180deg,#fff4d6,var(--gold) 55%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(230,205,151,.35))}
h2{font-size:clamp(28px,8vw,36px);color:var(--gold);margin-bottom:10px}
.date{font-family:var(--serif);font-size:24px;letter-spacing:.28em;color:var(--gold);margin:12px 0 4px}
p{margin:0 0 14px;line-height:1.65;font-size:16px;color:var(--ink)}
.mute{color:var(--mute);font-size:14.5px}
button.btn{font:inherit;font-weight:600;font-size:16px;letter-spacing:.03em;cursor:pointer;color:#1a1030;border:0;border-radius:999px;padding:14px 30px;margin-top:12px;min-height:48px;background:linear-gradient(135deg,#f4e2b4,var(--gold) 50%,var(--gold2));box-shadow:0 0 26px rgba(230,205,151,.3)}
button.btn.ghost{background:none;color:var(--gold);border:1px solid var(--line);box-shadow:none}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.hidden{display:none!important}
.con{width:min(78vw,300px,34vh);width:min(78vw,300px,34dvh);height:auto;margin:10px auto 4px;overflow:visible}
#c1 .con{width:min(60vw,240px,24vh);width:min(60vw,240px,24dvh)}
.con .ln{stroke:rgba(230,205,151,.16);stroke-width:.6;fill:none}
.con .st{fill:#cfc4e8;opacity:.75;animation:tw 3s ease-in-out infinite}
.con .st:nth-child(odd){animation-delay:-1.4s}
.con.lit .ln{stroke:var(--gold);stroke-width:.9;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s forwards;animation-delay:calc(var(--i)*.22s);filter:drop-shadow(0 0 2px var(--gold))}
.con.lit .st{fill:var(--gold);opacity:1;filter:drop-shadow(0 0 3px var(--gold))}
.con .an{fill:#ff8a5c;filter:drop-shadow(0 0 4px #ff8a5c);animation:tw 2.4s ease-in-out infinite}
.con.big{width:min(60vw,230px)}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes tw{50%{opacity:.35}}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin:10px 0 4px}
.opt{font:inherit;font-size:15px;cursor:pointer;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:10px 4px;min-height:56px;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center}
.opt b{font-family:var(--serif);font-size:22px;color:var(--gold);font-weight:500;line-height:1}
.opt.bad{border-color:#d86b7a;animation:sh .4s}.opt.good{border-color:var(--gold);background:rgba(230,205,151,.16)}
.fb{min-height:3.2em;font-size:15px;color:var(--mute);margin:4px 0;line-height:1.5}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:sh .4s}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;margin:12px 0}
.card{aspect-ratio:3/4;perspective:600px;cursor:pointer;border:0;background:none;padding:0}
.card .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;transform:rotateY(180deg)}
.card.up .in{transform:none}
.card .f,.card .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;justify-content:center}
.card .f{background:var(--glass);border:1px solid var(--line);font-size:clamp(28px,9vw,40px)}
.card .f{overflow:hidden;padding:0}.card .f img{width:100%;height:100%;object-fit:cover;display:block}
.card .b{transform:rotateY(180deg);background:linear-gradient(160deg,var(--purple),#15174a);border:1px solid var(--gold2);color:var(--gold);font-size:22px}
.card.ok .f{border-color:var(--gold);box-shadow:0 0 18px rgba(230,205,151,.5)}
.timer{font-family:var(--serif);font-size:44px;color:var(--gold);line-height:1}
.chest{width:min(70vw,230px,28vh);width:min(70vw,230px,28dvh);margin:4px auto;display:block}
.lid{transform-box:fill-box;transform-origin:0 100%;transition:transform 1s cubic-bezier(.3,1.3,.5,1)}
.open .lid{transform:rotate(-62deg)}
.burst{position:absolute;left:50%;top:38%;width:10px;height:10px;border-radius:50%;opacity:0;transform:translate(-50%,-50%)}
.open~.burst,.burst.go{animation:burst 1.6s ease-out forwards}
@keyframes burst{0%{opacity:.9;box-shadow:0 0 0 0 #fff4d6}100%{opacity:0;box-shadow:0 0 0 260px rgba(230,205,151,0)}}
.slots{display:flex;gap:10px;justify-content:center;margin:8px 0}
.slot{width:50px;height:56px;border:1px solid var(--line);border-radius:12px;background:var(--glass);font-family:var(--serif);font-size:34px;color:var(--gold);display:flex;align-items:center;justify-content:center}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:8px;justify-content:center;margin:6px 0}
.pad button{font-family:var(--serif);font-size:28px;height:clamp(44px,7vh,56px);height:clamp(44px,7dvh,56px);border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer;padding:0}
.wrap{position:relative;width:100%}
#mail{position:fixed;inset:0;z-index:9;background:rgba(6,8,26,.86);display:flex;align-items:center;justify-content:center;padding:18px;animation:in .5s both}
.env{position:relative;width:min(80vw,300px);height:200px;background:linear-gradient(160deg,#3a2a6a,#241a4a);border:1px solid var(--gold2);border-radius:6px;box-shadow:0 20px 50px #000}
.flap{position:absolute;left:0;right:0;top:0;height:110px;background:linear-gradient(#4a3680,#33265f);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s;border-top:1px solid var(--gold2)}
.env.op .flap{transform:rotateX(180deg)}
.seal{position:absolute;left:50%;top:92px;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:radial-gradient(#f4e2b4,var(--gold2));color:#2a1250;display:flex;align-items:center;justify-content:center;transition:opacity .4s}
.env.op .seal{opacity:0}
.letter{max-height:86vh;max-height:86dvh;overflow:auto;width:100%;max-width:440px;background:#f4ecd8;color:#2a1f3d;border-radius:8px;padding:28px 24px;text-align:left;box-shadow:0 20px 60px #000;animation:in .9s both}
.letter p{color:#2a1f3d;font-family:var(--serif);font-size:20px;line-height:1.55;margin:0 0 14px;opacity:0;animation:in .9s forwards}
.letter .sg{font-style:italic;text-align:right;color:#6a4a1a}
/* ---- Hiệu ứng 3D: nghiêng theo tay/chuột, bánh kem 3D, bóng bay ---- */
.con,.chest{transform:perspective(700px) rotateY(calc(var(--tx,0)*12deg)) rotateX(calc(var(--ty,0)*-9deg));transition:transform .2s ease-out}
.scene{position:relative;width:min(88vw,300px);height:min(300px,38vh);height:min(300px,38dvh);margin:0 auto;perspective:900px;cursor:pointer}
.tilt{position:absolute;left:50%;top:74%;width:0;height:0;transform-style:preserve-3d;scale:var(--ck,1);transform:rotateX(calc(60deg + var(--ty,0)*-10deg)) rotateZ(calc(var(--tx,0)*14deg));transition:transform .2s ease-out}
/* Chòm sao ở màn cuối nằm phía sau bánh kem để không đẩy nút xuống dưới */
#cw{position:relative;width:100%}
#c4{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.5;pointer-events:none}
#c4 .con{margin:0;width:min(60vw,230px,34vh);width:min(60vw,230px,34dvh)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.row .btn{padding:12px 20px}
.sway{position:absolute;left:0;top:0;transform-style:preserve-3d;animation:sway 7s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotateZ(-14deg)}to{transform:rotateZ(14deg)}}
.dk{position:absolute;left:0;top:0;border-radius:50%}
.pr{position:absolute;left:0;top:0;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7d6,#d4af6a 60%,#8a6a2a)}
.cd{position:absolute;left:0;top:0;transform-style:preserve-3d}
.cs{position:absolute;left:-3.5px;top:-34px;width:7px;height:34px;transform-origin:50% 100%;transform:rotateX(-90deg);background:repeating-linear-gradient(180deg,#f6efe0 0 6px,#e6cd97 6px 12px);border-radius:2px}
.fl{position:absolute;left:50%;top:-15px;width:10px;height:16px;margin-left:-5px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(circle at 50% 70%,#fff8d0 15%,#ffb02e 55%,rgba(255,150,40,0) 75%);box-shadow:0 0 14px 4px rgba(255,176,46,.55);animation:fk .4s ease-in-out infinite alternate}
@keyframes fk{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}
.out .fl{display:none}
.bl{position:fixed;bottom:-90px;width:46px;height:58px;border-radius:50% 50% 48% 48%;background:radial-gradient(circle at 34% 28%,#fff 0,var(--c) 40%,rgba(10,16,48,.45) 120%);z-index:3;pointer-events:none;animation:bl linear forwards;box-shadow:0 0 18px rgba(230,205,151,.25)}
.bl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:46px;background:rgba(230,205,151,.5)}
@keyframes bl{to{transform:translate(var(--dx),-135vh)}}
/* ---- Điện thoại màn hình thấp: thu gọn để mỗi màn vừa một khung, không phải cuộn ---- */
@media (max-height:760px){.scene{--ck:.82}h1{font-size:clamp(40px,11vw,60px)}.date{margin:8px 0 2px;font-size:21px}p{margin-bottom:10px;line-height:1.55}h2{margin-bottom:6px}button.btn{margin-top:8px}.fb{min-height:2.8em}.chest{width:min(70vw,230px,22vh);width:min(70vw,230px,22dvh)}.slot{height:50px}}
@media (max-height:640px){.scene{--ck:.7}.grid{gap:8px;margin:8px 0}.mute{font-size:13.5px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}.sway,.fl{animation:none!important}.bl{display:none}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="top">
  <div id="prog" role="progressbar" aria-label="Số nhiệm vụ đã hoàn thành"><i></i><i></i><i></i></div>
  <span id="lab">0/3</span>
  <button class="ib" id="snd" aria-label="Bật âm thanh" aria-pressed="false">🔇</button>
  <button class="ib" id="rst" aria-label="Chơi lại từ đầu">↺</button>
</div>
<main>
  <section class="stage" id="s0">
    <p class="mute" style="letter-spacing:.3em;margin-bottom:10px">BIRTHDAY QUEST</p>
    <h1>Written in the Stars</h1>
    <div class="date" id="d0"></div>
    <div id="c0"></div>
    <p id="intro" style="max-width:380px"></p>
    <button class="btn" id="b0">Bắt đầu hành trình</button>
  </section>

  <section class="stage" id="s1">
    <p class="mute">Màn 1 · The Constellation</p>
    <h2 id="q1"></h2>
    <div id="c1"></div>
    <div class="opts" id="o1"></div>
    <div class="fb" id="f1" aria-live="polite"></div>
    <button class="btn hidden" id="b1">Tiếp tục</button>
  </section>

  <section class="stage" id="s2">
    <p class="mute">Màn 2 · Memory Challenge</p>
    <h2>Ghi nhớ hành trang</h2>
    <p class="mute" id="t2">Nhớ vị trí các cặp ảnh.</p>
    <div class="timer" id="tm" aria-live="off"></div>
    <div class="grid" id="g2"></div>
    <div class="fb" id="f2" aria-live="polite"></div>
    <button class="btn hidden" id="b2">Tiếp tục</button>
  </section>

  <section class="stage" id="s3">
    <p class="mute">Màn 3 · The Secret Vault</p>
    <h2>Kho báu bí mật</h2>
    <div class="wrap" id="vw">
      <svg class="chest" id="chest" viewBox="0 0 200 160" role="img" aria-label="Chiếc rương kho báu">
        <rect x="20" y="70" width="160" height="80" rx="8" fill="#3a2a6a" stroke="#b98f4a" stroke-width="3"/>
        <rect x="20" y="96" width="160" height="10" fill="#b98f4a" opacity=".6"/>
        <g class="lid"><path d="M20 70 Q20 22 100 22 Q180 22 180 70 Z" fill="#4a3680" stroke="#b98f4a" stroke-width="3"/><path d="M20 62 H180" stroke="#b98f4a" stroke-width="5"/></g>
        <rect x="88" y="78" width="24" height="30" rx="4" fill="#e6cd97" stroke="#7a5a22" stroke-width="2"/><circle cx="100" cy="92" r="4" fill="#4a3680"/>
      </svg>
      <div class="burst" id="burst"></div>
    </div>
    <p class="mute" id="h3">Nhập mật mã 4 chữ số để mở rương.</p>
    <div class="slots" id="sl"></div>
    <div class="fb" id="f3" aria-live="polite"></div>
    <div class="pad" id="pd"></div>
    <button class="btn hidden" id="b3">Mở điều ước</button>
  </section>

  <section class="stage" id="s4">
    <div class="mute" style="letter-spacing:.3em">THE BIRTHDAY WISH</div>
    <h1 id="hb"></h1>
    <div class="date" id="d4"></div>
    <div id="cw"><div id="c4"></div>
    <div class="scene" id="scene" aria-label="Chiếc bánh sinh nhật 3D, chạm để thổi nến" role="img"><div class="tilt"><div class="sway" id="cake"></div></div></div></div>
    <p id="ws" style="max-width:360px"></p>
    <button class="btn" id="b6">Thổi nến 🕯️</button>
    <div class="row">
      <button class="btn ghost" id="b4">Mở lời nhắn bí mật</button>
      <button class="btn ghost" id="b5" aria-label="Chơi lại từ đầu">↺ Chơi lại</button>
    </div>
  </section>
</main>
<div id="mail" class="hidden"></div>

<script>
/* ================= CONFIG: chỉ cần sửa ở đây ================= */
var CONFIG={
  name:'Đặng Ngọc Hoài Thương', short:'Thương',
  date:{d:'03',m:'11',y:'1995'},
  intro:'Có một ngôi sao đã chờ đúng ngày này để tỏa sáng. Hôm nay, cả vũ trụ có một nhiệm vụ dành riêng cho chị.',
  quiz:{
    q:'Người sinh ngày 03/11 thuộc cung hoàng đạo nào?',
    options:[{n:'Thiên Bình',s:'♎'},{n:'Bọ Cạp',s:'♏'},{n:'Nhân Mã',s:'♐'},{n:'Xử Nữ',s:'♍'},{n:'Ma Kết',s:'♑'},{n:'Cự Giải',s:'♋'}],
    correct:'Bọ Cạp',
    wrong:{'Thiên Bình':'Thiên Bình mà vậy thì không cân nổi hành lý đi phượt đâu.','Nhân Mã':'Nhân Mã thích phiêu lưu thật, nhưng lần này chị lạc đường rồi.','Xử Nữ':'Xử Nữ cầu toàn lắm, nhưng đáp án vẫn chưa đúng.','Ma Kết':'Ma Kết leo núi giỏi, nhưng leo nhầm núi rồi.','Cự Giải':'Cự Giải đi ngang được, còn đáp án thì không.'},
    ok:'Chòm sao Bọ Cạp đã sáng. Ngôi sao đỏ Antares chính là trái tim của nó.'
  },

/* ---------- Chòm sao SVG ---------- */

/* ---- Nghiêng 3D theo chuột / cảm biến điện thoại ---- */
var rootS=document.documentElement.style;

/* ---- Pháo giấy ---- */
var cf=[];
function confettiBurst(x,y,n){var c=['#e6cd97','#fff4d6','#c9a4e0','#b98f4a','#ffffff'];for(var i=0;i<n;i++)cf.push({x:x,y:y,vx:(Math.random()-.5)*14*D,vy:(-Math.random()*13-3)*D,w:(5+Math.random()*6)*D,h:(3+Math.random()*4)*D,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:c[i%5]})}
function confettiRain(){if(reduce)return;var c=['#e6cd97','#fff4d6','#c9a4e0','#b98f4a','#ffffff'];for(var i=0;i<90;i++)cf.push({x:Math.random()*W,y:-Math.random()*H*.7,vx:(Math.random()-.5)*2*D,vy:(1+Math.random()*1.5)*D,w:(5+Math.random()*5)*D,h:(3+Math.random()*4)*D,r:Math.random()*6,vr:(Math.random()-.5)*.2,c:c[i%5]})}

/* ---- Bánh kem 3D (xếp nhiều lớp đĩa theo trục Z) ---- */
function el(cls,css,parent){var d=document.createElement('div');if(cls)d.className=cls;d.style.cssText=css;parent.appendChild(d);return d}
function buildCake(){
  var c=$('cake');c.textContent='';
  /* [bán kính, chiều cao, z bắt đầu, màu thân, màu mặt trên] */
  var T=[[120,6,0,'#4a3680','#6a52b8'],[92,50,6,'#d9bd82','#f4e4b8'],[66,42,56,'#bfa4e6','#e0d2f8'],[42,34,98,'#efe6d2','#fffaf0']];
  T.forEach(function(t,i){

      el('dk','width:'+t[0]*2+'px;height:'+t[0]*2+'px;margin:-'+t[0]+'px 0 0 -'+t[0]+'px;background:'+(top?t[4]:t[3])+';transform:translateZ('+z+'px);'+(top&&i>0?'box-shadow:inset 0 0 0 3px #d4af6a,inset 0 0 22px rgba(255,255,255,.55)':''),c)}
    if(i>0){var n=[0,18,14,10][i],zt=t[2]+t[1]+1;for(var k=0;k<n;k++){el('pr','transform:rotateZ('+360/n*k+'deg) translateX('+(t[0]-6)+'px) translateZ('+zt+'px)',c)}}
  });

/* ---- Bài Happy Birthday (tạo bằng code) ---- */

  if(!soundOn)return;

    var T=.42,at=AC.currentTime+.1,m=[[392,.75],[392,.25],[440,1],[392,1],[523,1],[494,2],[392,.75],[392,.25],[440,1],[392,1],[587,1],[523,2],[392,.75],[392,.25],[784,1],[659,1],[523,1],[494,1],[440,1],[698,.75],[698,.25],[659,1],[523,1],[587,1],[523,2]];
    m.forEach(function(n){var o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=n[0];g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(.16,at+.03);g.gain.exponentialRampToValueAtTime(.001,at+n[1]*T);o.connect(g);g.connect(AC.destination);o.start(at);o.stop(at+n[1]*T+.05);at+=n[1]*T})}catch(e){}

function loop(t){
  cx.clearRect(0,0,W,H);
  stars.forEach(function(s){s.y-=s.v;if(s.y<0)s.y=1;var a=.3+.7*Math.abs(Math.sin(t/1100+s.p));cx.fillStyle=(s.d?'rgba(230,205,151,':'rgba(246,239,224,')+a+')';cx.beginPath();cx.arc(s.x*W,s.y*H,s.r*D*(s.d?1.3:1),0,7);cx.fill()});

/* ---------- Điều hướng màn ---------- */

/* ---------- Màn 1 ---------- */
function init0(){$('d0').textContent=C.date.d+' · '+C.date.m+' · '+C.date.y;$('c0').innerHTML=con();$('intro').textContent=C.intro;clear(0)}

function init1(){

  var o=$('o1');o.textContent='';
  C.quiz.options.forEach(function(op){var b=document.createElement('button');b.className='opt';b.innerHTML='<b></b><span></span>';b.firstChild.textContent=op.s;b.lastChild.textContent=op.n;
    b.onclick=function(){
      if(op.n!==C.quiz.correct){b.classList.add('bad');$('f1').textContent=C.quiz.wrong[op.n]||'Chưa đúng, thử lại nhé.';err();later(function(){b.classList.remove('bad')},450);return}
      b.classList.add('good');[].forEach.call(o.children,function(x){x.disabled=true});
      $('c1').firstChild.classList.add('lit');$('f1').textContent=C.quiz.ok;chime();clear(1);

/* ---------- Màn 3 ---------- */
var first=null,lock=true,matched=0,miss=0;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0,t=a[i];a[i]=a[j];a[j]=t}return a}
function init2(){
  var g=$('g2');g.textContent='';first=null;lock=true;matched=0;miss=0;$('b2').classList.add('hidden');$('f2').textContent='';
  var M=C.memory,usePh=M.photos&&M.photos.length,N=usePh?M.photos.length:M.icons.length,ix=[];for(var k=0;k<N;k++)ix.push(k,k);var ic=shuffle(ix);
  ic.forEach(function(s){var b=document.createElement('button');b.className='card up';b.dataset.s=s;b.setAttribute('aria-label','Thẻ bài');
    b.innerHTML='<div class="in"><div class="f"></div><div class="b">✦</div></div>';var f=b.querySelector('.f');
    if(usePh){var im=new Image();im.src=M.photos[s];im.alt='Ảnh kỷ niệm';f.appendChild(im)}else f.textContent=M.icons[s];
    b.onclick=function(){pick(b)};g.appendChild(b)});
  var n=C.memory.seconds;$('tm').textContent=n;$('t2').textContent='Nhớ vị trí các cặp ảnh.';
  (function tick(){if(cur!==2)return;if(n<=0){[].forEach.call(g.children,function(c){c.classList.remove('up')});$('tm').textContent='';$('t2').textContent='Bây giờ hãy tìm đủ các cặp.';lock=false;return}
    $('tm').textContent=n--;later(tick,1000)})();
}
function pick(b){

  b.classList.add('up');

  var a=first;first=null;lock=true;
  if(a.dataset.s===b.dataset.s){a.classList.add('ok');b.classList.add('ok');matched++;chime();lock=false;
    if(matched===(C.memory.photos&&C.memory.photos.length||C.memory.icons.length)){$('f2').textContent=C.memory.done+(miss?' (Số lần nhầm: '+miss+')':' Không nhầm lần nào.');clear(2);later(function(){reveal('b2')},900)}else $('f2').textContent='Đúng một cặp.'}
  else{miss++;err();$('f2').textContent='Chưa khớp, nhớ lại nào.';later(function(){a.classList.remove('up');b.classList.remove('up');lock=false},750)}
}
$('b2').onclick=function(){go(3)};

/* ---------- Màn 4 ---------- */
var code='',tries=0,vdone=false;
function init3(){
  code='';tries=0;vdone=false;$('vw').classList.remove('open');$('chest').classList.remove('open');$('burst').classList.remove('go');
  $('h3').textContent=C.vault.hint;$('f3').textContent='';$('b3').classList.add('hidden');$('pd').classList.remove('hidden');draw();
  var p=$('pd');p.textContent='';['1','2','3','4','5','6','7','8','9','⌫','0','↵'].forEach(function(k){var b=document.createElement('button');b.textContent=k;b.setAttribute('aria-label',k==='⌫'?'Xóa':k==='↵'?'Xác nhận':k);b.onclick=function(){key(k)};p.appendChild(b)});
}
function draw(){var s=$('sl');s.textContent='';for(var i=0;i<C.vault.code.length;i++){var d=document.createElement('div');d.className='slot';d.textContent=code[i]?'●':'';s.appendChild(d)}}
function key(k){
  if(vdone)return;
  if(k==='⌫')code=code.slice(0,-1);
  else if(k==='↵'){if(code.length<C.vault.code.length){$('f3').textContent='Cần đủ '+C.vault.code.length+' chữ số.';return}check();return}
  else if(code.length<C.vault.code.length)code+=k;
  draw();if(code.length===C.vault.code.length&&k!=='⌫')check();
}
function check(){
  if(code===C.vault.code){vdone=true;$('f3').textContent=C.vault.ok;$('chest').classList.add('open');$('burst').classList.add('go');chime();clear(3);$('pd').classList.add('hidden');later(function(){reveal('b3')},1400)}
  else{$('f3').textContent=C.vault.wrong[Math.min(tries,C.vault.wrong.length-1)];tries++;err();$('sl').classList.add('shake');later(function(){$('sl').classList.remove('shake');code='';draw()},450)}
}
document.addEventListener('keydown',function(e){if(cur!==3)return;if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('⌫');else if(e.key==='Enter')key('↵')});

    h+='<p class="sg" style="animation-delay:'+(.6+L.paragraphs.length*.8)+'s"></p><div style="text-align:center"><button class="btn" id="cl">Đóng thư</button></div></div>';
